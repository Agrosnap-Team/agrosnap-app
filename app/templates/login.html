<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" href="../static/images/agrosnap%20logo.PNG">
    <link rel="stylesheet" href="../static/css/login.css">
    <link rel="stylesheet" href="../static/css/general_style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agbalumo&display=swap" rel="stylesheet">


    <title>AgroSnap | Login</title>
</head>
<body>

    <div class="login-container">
            <header class="header">
        <h1>Login</h1>
    </header>
    <p id="msg">this is a message to inform the user about their login status. </p>
    


        <form action="/login" method="post">
            <input type="text"  class="fields items" id="username" name="username" placeholder="Username or Email" required>


            <input type="password" class ="fields items" id="password" name="password" placeholder="Password" required>
            <button type="submit" class="items btns" id="submit">Login</button>
            <button type="button" class="items btns" id="back_button">Back</button>
        </form>

        <p>If you don't have an account please <a href="../templates/registration.html">click here</a></p>

    </div>

</body>
</html>
